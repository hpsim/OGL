# ============================================================
#  GPU-specific images and runner configuration
# ============================================================
# OpenFOAM v2512 (conda build) on the Ginkgo develop images, from
# exasim-project/openfoam-conda. OpenFOAM uses the MPI of the Ginkgo image (MPICH,
# GPU-aware for CUDA and ROCm; Intel MPI for SYCL). Ginkgo 0dfd8c5 includes
# LinOpFactory::ReuseData (ginkgo-project/ginkgo#2117).
# Dated tags: the runner caches SIF images by name.
.gpu-nvidia:
  tags: ["nvidia-gpus"]
  image: ghcr.io/exasim-project/openfoam-ginkgo-cuda:2512-20261010
  variables:
    GPU_VENDOR: nvidia

.gpu-amd:
  tags: ["amd-gpus"]
  image: ghcr.io/exasim-project/openfoam-ginkgo-rocm:2512-20261010
  variables:
    GPU_VENDOR: amd

.gpu-intel:
  tags: ["intel-gpus"]
  image: ghcr.io/exasim-project/openfoam-ginkgo-sycl:2512-20261009-2
  variables:
    GPU_VENDOR: intel

# ============================================================
#  Rule blocks
# ============================================================
# testing
.rules-ogl-testing:
  rules:
    - if: '$GPU_VENDOR == "nvidia" && $SKIP_NVIDIA != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "amd" && $SKIP_AMD != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always

    - if: '$GPU_VENDOR == "intel" && $SKIP_INTEL != "true" &&
           $CI_PIPELINE_SOURCE == "trigger" && $BENCHMARK != "true"'
      when: always
    - when: never

# ============================================================
#  Job templates
# ============================================================
.build-and-test:
  script:
    - ./ci/lrz-gitlab/build-and-test.sh

# ============================================================
#  OGL - testing jobs
# ============================================================
build-test-ogl-nvidia:
  extends:
    - .gpu-nvidia
    - .rules-ogl-testing
    - .build-and-test

build-test-ogl-amd:
  extends:
    - .gpu-amd
    - .rules-ogl-testing
    - .build-and-test

build-test-ogl-intel:
  extends:
    - .gpu-intel
    - .rules-ogl-testing
    - .build-and-test
